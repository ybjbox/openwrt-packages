<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAV 采集器 · 配置与状态</title>
<style>
:root{
  --bg:#0b0f14;--surface:rgba(255,255,255,.05);--fg:#e9eef3;--muted:#93a1af;--faint:#5f6d7a;
  --border:rgba(255,255,255,.09);--border-2:rgba(255,255,255,.18);
  --accent:#43e0a0;--accent-dim:rgba(67,224,160,.13);--success:#43e0a0;--warn:#e6b357;--danger:#e5646c;
  --warn-dim:rgba(230,179,87,.12);--danger-dim:rgba(229,100,108,.12);
  --r-md:14px;--r-sm:8px;--speed:150ms;--ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--surface:rgba(255,255,255,.8);--fg:#182028;--muted:#5c6b78;--faint:#93a1ad;--border:rgba(16,26,36,.1);--border-2:rgba(16,26,36,.2);--accent:#0b8f5f;--success:#0b8f5f;--warn:#a9700f;--danger:#c2454d;--warn-dim:rgba(169,112,15,.1);--danger-dim:rgba(194,69,77,.1);--accent-dim:rgba(11,143,95,.1)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:18px;font-weight:650;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--success)}.dot.bad{background:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-top:14px}
.card h2{font-size:14px;font-weight:650;margin:0 0 12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.state{font-weight:600}
.state.ok{color:var(--success)}.state.bad{color:var(--danger)}.state.warn{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted)}
.field input{height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--fg);font:inherit;padding:0 10px}
.field input:focus{border-color:var(--border-2);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{height:34px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;background:var(--accent-dim);color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.pwrow{display:flex;gap:8px;align-items:center}
.msg{font-size:12px;margin-top:8px;min-height:16px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--success)}
.warnbox{background:var(--warn-dim);border-radius:var(--r-sm);padding:8px 10px;font-size:12px;color:var(--fg);margin-top:10px}
.errbox{background:var(--danger-dim)}
.foot{margin-top:16px;font-size:11px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="connDot"></span>NAV 采集器<span id="ver" style="font-size:12px;color:var(--faint);font-weight:400"></span></h1>
  <div style="color:var(--muted);font-size:12px" id="summary">加载中…</div>

  <div class="card">
    <h2>Cloudflare 连接状态</h2>
    <div class="kv"><span class="k">连接状态</span><span class="v state" id="pushState">—</span></div>
    <div class="kv"><span class="k">最近成功推送</span><span class="v" id="lastOk">—</span></div>
    <div class="kv"><span class="k">最近一次尝试</span><span class="v" id="lastAttempt">—</span></div>
    <div class="kv"><span class="k">最近错误</span><span class="v" id="lastErr">—</span></div>
    <div class="kv"><span class="k">连续失败</span><span class="v" id="fails">0</span></div>
    <div class="kv"><span class="k">累计成功 / 失败</span><span class="v" id="totals">0 / 0</span></div>
    <div class="kv"><span class="k">云端配置版本</span><span class="v" id="cfgVer">—</span></div>
    <div class="kv"><span class="k">探活目标数</span><span class="v" id="checks">—</span></div>
    <div class="kv"><span class="k">进程运行时长</span><span class="v" id="uptime">—</span></div>
  </div>

  <div class="card">
    <h2>配置（写回 UCI 并自动重启服务）</h2>
    <div class="pwrow">
      <div class="field" style="flex:1;margin:0"><label>访问密码（nav.ui.password；未设置则无法修改）</label>
        <input type="password" id="pw" autocomplete="off" placeholder="留空则只能查看状态"></div>
      <button class="btn" id="loadBtn" style="margin-top:18px">加载配置</button>
    </div>
    <div id="form" style="display:none">
      <div class="field"><label>推送地址 push_url</label><input id="f-push_url"></div>
      <div class="grid2">
        <div class="field"><label>推送令牌（留空表示不修改）</label><input id="f-push_token" type="password" placeholder="••••••" autocomplete="off"></div>
        <div class="field"><label>实例标识 source</label><input id="f-source"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>间隔（秒）</label><input id="f-interval" type="number"></div>
        <div class="field"><label>服务探活 checks（1/0）</label><input id="f-checks"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>OpenClash 端口</label><input id="f-oc_port" type="number"></div>
        <div class="field"><label>OpenClash secret（留空不修改）</label><input id="f-oc_secret" type="password" placeholder="••••••" autocomplete="off"></div>
      </div>
      <div class="field"><label>阈值 cpu,mem,disk,temp,conn（逗号分隔）</label><input id="f-th"></div>
      <div class="grid2">
        <div class="field"><label>NAS SSH 主机</label><input id="f-nas_host"></div>
        <div class="field"><label>NAS SSH 用户</label><input id="f-nas_user"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 8px;cursor:pointer">
        <input type="checkbox" id="f-nas_logs"> 采集 NAS 系统日志（独立开关）
      </label>
      <div class="field"><label>新访问密码（留空不修改）</label><input id="f-ui_password" type="password" autocomplete="off"></div>
      <button class="btn" id="saveBtn">保存并重启服务</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="warnbox" id="pwWarn" style="display:none">
      未设置 ui.password —— 配置页当前只读。设置方法：
      <code>uci set nav.ui.password='你的密码' && uci commit nav && /etc/init.d/nav restart</code>
    </div>
  </div>

  <div class="foot">仅监听局域网 · 采集器不会把令牌回显到本页 · NAV</div>
</div>
<script>
const $=(id)=>document.getElementById(id);
const fmt=(ms)=>ms?new Date(ms).toLocaleTimeString("zh-CN"):"—";
function setDot(el,cls){el.className="dot "+cls}
async function loadStatus(){
  try{
    const s=await (await fetch("/api/status")).json();
    $("ver").textContent="v"+s.version;
    const p=s.push;
    const ok=p.connected&&p.last_ok_at>0;
    setDot($("connDot"),p.last_attempt_at===0?"":(ok?"ok":"bad"));
    $("pushState").textContent=p.last_attempt_at===0?"尚未推送":(ok?"已连接":"连接失败");
    $("pushState").className="v state "+(p.last_attempt_at===0?"":(ok?"ok":"bad"));
    $("lastOk").textContent=fmt(p.last_ok_at);
    $("lastAttempt").textContent=fmt(p.last_attempt_at);
    $("lastErr").textContent=p.last_error||"—";
    $("fails").textContent=p.consecutive_fails;
    $("totals").textContent=p.total_ok+" / "+p.total_fail;
    $("cfgVer").textContent=s.remote.config_version||"—";
    $("checks").textContent=s.remote.checks;
    const up=Math.floor(s.uptime_ms/1000);
    $("uptime").textContent=up<3600?Math.floor(up/60)+" 分钟":Math.floor(up/3600)+" 小时 "+Math.floor(up%3600/60)+" 分";
    $("summary").textContent="实例 "+s.source+" · 推送 "+s.push_url+" · 每 "+s.interval+" 秒";
  }catch(e){$("summary").textContent="状态加载失败: "+e.message}
}
$("loadBtn").addEventListener("click",async()=>{
  const pw=$("pw").value;
  try{
    const c=await (await fetch("/api/config",{headers:{"x-ui-password":pw}})).json();
    if(c.error!==undefined&&typeof c.error==="string")throw new Error(c.error);
    if(!c.main){$("msg").textContent=c.error||"加载失败";$("msg").className="msg err";
      if((c.error||"").includes("未设置访问密码"))$("pwWarn").style.display="block";return}
    $("form").style.display="block";
    $("pwWarn").style.display="none";
    $("f-push_url").value=c.main.push_url;
    $("f-source").value=c.main.source;
    $("f-interval").value=c.main.interval;
    $("f-checks").value=c.main.checks;
    $("f-oc_port").value=c.openclash.api_port;
    const th=[c.thresholds.cpu,c.thresholds.mem,c.thresholds.disk,c.thresholds.temp,c.thresholds.conn].join(",");
    $("f-th").value=th;
    $("f-nas_host").value=c.nas.host;
    $("f-nas_user").value=c.nas.user;
    $("f-nas_logs").checked=c.nas.logs==="1";
    $("msg").textContent="配置已加载";$("msg").className="msg ok";
  }catch(e){$("msg").textContent=e.message;$("msg").className="msg err"}
});
$("saveBtn").addEventListener("click",async()=>{
  const pw=$("pw").value;
  const body={main:{push_url:$("f-push_url").value.trim(),source:$("f-source").value.trim(),interval:$("f-interval").value.trim(),checks:$("f-checks").value.trim()},
              openclash:{api_port:$("f-oc_port").value.trim()},
              nas:{host:$("f-nas_host").value.trim(),user:$("f-nas_user").value.trim(),logs:$("f-nas_logs").checked?"1":"0"}};
  if($("f-push_token").value)body.main.push_token=$("f-push_token").value;
  if($("f-oc_secret").value)body.openclash.api_secret=$("f-oc_secret").value;
  const th=$("f-th").value.split(",").map(x=>x.trim());
  if(th.length===5&&!th.some(x=>!x)){body.thresholds={cpu:th[0],mem:th[1],disk:th[2],temp:th[3],conn:th[4]}}
  if($("f-ui_password").value)body.ui={password:$("f-ui_password").value};
  try{
    const res=await fetch("/api/config",{method:"POST",headers:{"content-type":"application/json","x-ui-password":pw},body:JSON.stringify(body)});
    const j=await res.json();
    if(!res.ok)throw new Error(j.error||res.status);
    $("msg").textContent="已保存（changed="+j.changed+"），服务重启中…";$("msg").className="msg ok";
    setTimeout(loadStatus,2500);
  }catch(e){$("msg").textContent="保存失败: "+e.message;$("msg").className="msg err"}
});
loadStatus();setInterval(loadStatus,10000);
</script>
</body>
</html>
