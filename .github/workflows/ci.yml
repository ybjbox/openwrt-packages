name: CI

# Triggers: every push / PR, plus manual dispatch (used to fire the SDK build).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-busybox:
    name: Lint & BusyBox hot-patch test
    runs-on: ubuntu-latest
    # Native BusyBox (ash) so our POSIX scripts are exercised exactly as on the
    # OpenWrt target. alpine's /bin/sh is busybox ash.
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: POSIX shell syntax & red-line lint
        run: sh tests/lint.sh

      - name: BusyBox hot-patch integration test
        run: sh tests/run_busybox_test.sh

  build:
    name: Build package (OpenWrt SDK)
    # Only build on manual dispatch to avoid burning SDK minutes on every push/PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        # gh-action-sdk has no "release" input; the target architecture is
        # selected via the ARCH environment variable.
        uses: openwrt/gh-action-sdk@v1
        env:
          ARCH: x86_64-24.10
